<h1>Character settings</h1>
<form [formGroup]="characterForm">
  <div class="field">
  <label>Profile Picture:</label>
  <div class="header-picture">
    <div class="picture-circle">
  @if (previewUrl()) {
    <img class="picture-image" [src]="previewUrl()" alt="preview" />
  } @else if (dataService.hero().img) {
    <img class="picture-image" [src]="dataService.hero().img" alt="current profile" />
  }
  </div>
  </div>
  <input  type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" style="display:none" />
  <button type="button" (click)="fileInput.click()">Changer l'image</button>
</div>
  <div class="field">
  <label for="charName">
    Name :
  </label>
  <input id="charName" formControlName="name" />
  </div>
  <div class="field">
    <label for="charClass">
        Class :
  </label>
  <input id="charClass" formControlName="class" />
  </div>
  <div class="field">
    <label for="charGithub">
        Github :
  </label>
  <input id="charGithub" formControlName="github" />
  </div>
  <div class="field">
    <label for="charLinkedin">
        Linkedin :
  </label>
  <input id="charLinkedin" formControlName="linkedin" />
  </div>
  <div class="field">
    <label for="charState">
        State : 
  </label>
    <select id="charState" formControlName="state">
        @for (state of charStates; track $index) {
            <option [value]="state">{{ state }}</option>
        }
    </select>
    </div>
  <button type="button" (click)="onSubmit()">Edit Character</button>
</form>
