
<form (ngSubmit)="onSubmit()">
    <button type="button" (click)="addForm()">Add Skill</button>
   @for (item of skillForm.controls; track $index) {
     <div [formGroup]="getSkillGroup($index)">
        <label for="skillName">
            Name: 
        </label>
        <input id="skillName" formControlName="name">
        <label for="skillRate">
            Rate: 
        </label>
        <input id="skillRate" formControlName="rate">
     </div>
     <button type="button" (click)="removeForm($index)">Remove Skill</button>
   }
   <br>
  <button type="submit">Save Skills</button>
</form>
